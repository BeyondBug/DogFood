services:
  portal:
    build: .
    ports:
      - "127.0.0.1:${DOGFOOD_PORT:-8080}:8080"
    environment:
      DOGFOOD_DB_PATH: /data/portal.sqlite3
      DOGFOOD_FIXTURES_PATH: /app/fixtures.json
      DOGFOOD_DEMO_MODE: "1"
      DOGFOOD_BOOTSTRAP_EMAIL: ${DOGFOOD_BOOTSTRAP_EMAIL:-}
      DOGFOOD_BOOTSTRAP_PASSWORD: ${DOGFOOD_BOOTSTRAP_PASSWORD:-}
    volumes:
      - portal-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 6

volumes:
  portal-data:
