<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>DOGFOOD · {% block title %}BeyondBug{% endblock %}</title><script src="/static/theme.js"></script><link rel="stylesheet" href="/static/fonts.css"><link rel="stylesheet" href="/static/style.css"><link rel="stylesheet" href="/static/workspace.css"><link rel="stylesheet" href="/static/theme.css"><script src="/static/app.js" defer></script></head>
<body>
  <header class="site-header"><a class="brand" href="/">BeyondBug<span class="brand-mark" aria-hidden="true">✳</span></a><nav aria-label="Main navigation"><a href="/events">Events</a><a href="/projects">Gallery</a>{% if principal %}<a href="/dashboard">Dashboard</a>{% else %}<a href="/account">Sign in</a>{% endif %}<button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch to dark mode" aria-pressed="false"><svg data-theme-icon viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path class="theme-moon" d="M20.2 15.3A8.4 8.4 0 0 1 8.7 3.8a8.5 8.5 0 1 0 11.5 11.5Z"/><g class="theme-sun"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></g></svg><span data-theme-label>Dark mode</span></button></nav></header>
  <div id="flash" class="flash" role="status" aria-live="polite" hidden></div>
  {% block content %}{% endblock %}
  <footer class="site-footer wrap"><span>BeyondBug</span><span>Built for fair, self-hosted hackathons.</span></footer>
</body></html>
